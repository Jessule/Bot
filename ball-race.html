<title>Ball Race</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: one 9:16 TikTok stage (comment prompt on top, three lanes below, each with grid arena + stacked HP bars + checkered finish). Controls sit outside the frame. */
:root{
  --page:#14131a;
  --paper:#ebe5da;
  --arena:#fcfaf3;
  --grid:#e6e1d4;
  --ink:#1c1b1f;
  --muted:#5b574f;
  --blue:#2f7be0; --blue-d:#1d56a8; --blue-l:#6aa6f2;
  --pink:#d62a74; --pink-d:#9c1655; --pink-l:#ec6aa3;
  --green:#22a35a; --green-d:#147040; --green-l:#5fcf8f;
  --display:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--page);color:var(--ink);font-family:var(--mono);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{
  container-type:inline-size;
  width:min(100%,calc((100dvh - 80px) * 9 / 16));
  aspect-ratio:9/16;max-width:100%;
  background:var(--paper);border-radius:3cqw;overflow:hidden;
  display:flex;flex-direction:column;gap:.6cqw;padding:3cqw 4cqw 2.5cqw;
}
.ask{display:flex;flex-direction:column;align-items:center;gap:1cqw;margin-bottom:.3cqw}
.cm{
  display:flex;align-items:center;gap:2cqw;background:#fff;border:.7cqw solid var(--ink);
  border-radius:6cqw;padding:1.2cqw 3.5cqw 1.2cqw 1.4cqw;box-shadow:0 .8cqw 0 var(--ink);
}
.av{width:6.5cqw;height:6.5cqw;border-radius:50%;background:conic-gradient(var(--blue) 0 33%,var(--pink) 0 66%,var(--green) 0);border:.5cqw solid var(--ink)}
.cm b{font:700 5.2cqw/1 var(--display);letter-spacing:-.02em}
.chips{display:flex;gap:2cqw;font:700 2.6cqw/1 var(--mono);color:#fff}
.chips span{padding:.9cqw 2.2cqw;border-radius:5cqw;border:.5cqw solid var(--ink)}
.lane{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;min-width:0}
.lane h2{
  margin:0;font:700 5.6cqw/1 var(--display);letter-spacing:-.03em;color:var(--c);display:flex;align-items:center;gap:1.6cqw;
  text-shadow:0 .4cqw 0 rgba(0,0,0,.12);
}
.crown{width:6cqw;height:4.4cqw;visibility:hidden}
.lane.lead .crown{visibility:visible}
.sub{font:700 2.3cqw/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:.3cqw 0 .8cqw;text-align:center}
.box{
  position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;
  background-color:var(--arena);border:.9cqw solid var(--ink);border-radius:1.6cqw;overflow:hidden;
  background-image:linear-gradient(var(--grid) .2cqw,transparent .2cqw),linear-gradient(90deg,var(--grid) .2cqw,transparent .2cqw);
  background-size:5cqw 5cqw;
}
.arena{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.next{
  position:absolute;left:1.6cqw;top:1.6cqw;font:700 2.4cqw/1 var(--mono);color:var(--c-d);
  background:var(--arena);border:.5cqw solid var(--c-d);border-radius:5cqw;padding:.8cqw 2cqw;
}
.bars{display:flex;flex-direction:column}
.hp{position:relative;height:5cqw;border-top:.5cqw solid var(--ink);background:var(--c-d);overflow:hidden}
.hp .fill{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(var(--c-l) 0 18%,var(--c) 18% 100%)}
.hp .n{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:700 3.6cqw/1 var(--mono);color:#fff;-webkit-text-stroke:.8cqw var(--ink);paint-order:stroke fill;
}
.hp.dead{display:none}
.finish{height:2cqw;border-top:.5cqw solid var(--ink);background:repeating-conic-gradient(var(--ink) 0 25%,var(--arena) 0 50%) 0 0/2cqw 2cqw}
.lane.done .finish{background:var(--c)}
.banner{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1cqw;
  background:rgba(252,250,243,.8);font:700 8cqw/1 var(--display);color:var(--c);
}
.banner small{font:700 3cqw/1 var(--mono);color:var(--ink)}
.lane.done .banner{display:flex}
.vs{font:700 5cqw/.8 var(--display);text-align:center;color:var(--ink);flex:none;margin:-.2cqw 0}

#l-dbl{--c:var(--blue);--c-d:var(--blue-d);--c-l:var(--blue-l)}
#l-tfa{--c:var(--pink);--c-d:var(--pink-d);--c-l:var(--pink-l)}
#l-tri{--c:var(--green);--c-d:var(--green-d);--c-l:var(--green-l)}

.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.ctl .st{font:700 12px var(--mono);color:#cfcbd8;min-width:100%;text-align:center}
button{
  font:700 13px var(--mono);color:var(--ink);background:var(--arena);
  border:3px solid var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 #000;
}
button:active{transform:translateY(3px);box-shadow:none}
button[aria-pressed="true"]{background:#ffd23f}
button:focus-visible{outline:3px solid var(--blue-l);outline-offset:2px}
</style>

<div class="stage" id="stage">
  <div class="ask">
    <div class="cm"><div class="av"></div><b>Comment who will win</b></div>
    <div class="chips"><span style="background:var(--blue)">DOUBLE</span><span style="background:var(--pink)">TRIPLE FACTORIAL</span><span style="background:var(--green)">TRIBONACCI</span></div>
  </div>
  <section class="lane" id="l-dbl"></section>
  <div class="vs">VS</div>
  <section class="lane" id="l-tfa"></section>
  <div class="vs">VS</div>
  <section class="lane" id="l-tri"></section>
</div>

<div class="ctl">
  <div class="st" id="status">Race in progress</div>
  <button id="restart">Restart</button>
  <button class="spd" data-s="1" aria-pressed="true">x1</button>
  <button class="spd" data-s="2" aria-pressed="false">x2</button>
  <button class="spd" data-s="4" aria-pressed="false">x4</button>
</div>

<script>
(function(){
  var LAYERS=[159992,61e9,250e15];
  var speedMul=1;
  var G_K=4.5;        // gravity = G_K * arena height per s^2
  var PEAK_MIN=0.4, PEAK_MAX=0.9;  // bounce height range, fraction of arena height
  var VX_MIN=0.2;     // slowest horizontal speed, fraction of width per s

  var CROWN='<svg class="crown" viewBox="0 0 30 22"><path d="M2 18 0 4l8 7 7-10 7 10 8-7-2 14z" fill="#f2b21c" stroke="#1c1b1f" stroke-width="2" stroke-linejoin="round"/></svg>';

  var SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  function fmt(x){
    var i=0;
    while(x>=1000&&i<SUF.length-1){x/=1000;i++}
    if(i===0)return String(Math.floor(x));
    var dec=x>=100?1:2,m=Math.pow(10,dec);
    var s=(Math.floor(x*m+1e-6)/m).toFixed(dec);
    return s.replace(/\.?0+$/,'')+SUF[i];
  }

  // Arena geometry and the fixed bounce energy that goes with it.
  function geo(L){
    var w=L.cw,h=L.ch,R=L.R,g=G_K*h,span=h-2*R;
    var vyMin=Math.sqrt(2*g*span*PEAK_MIN),vyMax=Math.sqrt(2*g*span*PEAK_MAX);
    var vxMin=w*VX_MIN;
    return {w:w,h:h,R:R,g:g,vyMin:vyMin,vyMax:vyMax,S2:vyMax*vyMax+vxMin*vxMin};
  }

  function mk(L){
    var G=geo(L),peak=PEAK_MIN+Math.random()*(PEAK_MAX-PEAK_MIN);
    var y=G.R+(G.h-2*G.R)*(1-peak);           // start at the top of an arc
    return {x:G.w*(0.2+Math.random()*0.6),y:y,
      vx:(Math.random()<.5?-1:1)*Math.sqrt(Math.max(0,G.S2-2*G.g*(G.h-2*G.R)*peak)),
      vy:0,p:1,tr:[],rot:0,sq:0,ax:'y'};
  }

  var defs=[
    {id:'l-dbl',title:'DOUBLE BALL',sub:'x2 every hit',
      init:function(L){L.p=1;L.balls=[mk(L)]},
      next:function(L){return 'NEXT HIT: '+fmt(L.p)},
      hit:function(L){var d=L.p;L.p*=2;return d},
      label:'x2'},
    {id:'l-tfa',title:'TRIPLE FACTORIAL BALL',sub:'n!!! = n·(n−3)·(n−6)… · 1, 2, 3, 4, 10, 18, 28, 80…',
      init:function(L){L.n=1;L.m=[1,1,1];L.next=1;L.balls=[mk(L)]},
      next:function(L){return 'NEXT HIT: '+L.n+'!!! = '+fmt(L.next)},
      hit:function(L){
        var d=L.next;L.m[L.n%3]=d;L.n++;
        L.next=L.n*(L.n>3?L.m[L.n%3]:1);
        return d},
      label:'!!!'},
    {id:'l-tri',spd:1.15,title:'TRIBONACCI BALL',sub:'adds the last three · 1, 1, 2, 4, 7, 13…',
      init:function(L){L.a=1;L.b=1;L.c=2;L.balls=[mk(L)]},
      next:function(L){return 'NEXT HIT: '+fmt(L.a)},
      hit:function(L){var d=L.a,n=L.a+L.b+L.c;L.a=L.b;L.b=L.c;L.c=n;return d},
      label:'T'}
  ];

  var lanes=[];
  defs.forEach(function(d){
    var el=document.getElementById(d.id);
    el.innerHTML='<h2>'+CROWN+'<span>'+d.title+'</span></h2><div class="sub">'+d.sub+'</div>'+
      '<div class="box"><div class="arena"><canvas></canvas><div class="next"></div></div>'+
      '<div class="bars"></div><div class="finish"></div><div class="banner"><span>FINISH!</span><small></small></div></div>';
    var L={d:d,el:el,cv:el.querySelector('canvas'),nx:el.querySelector('.next'),
      bars:el.querySelector('.bars'),banner:el.querySelector('.banner small'),texts:[],cw:300,ch:150,R:11};
    L.ctx=L.cv.getContext('2d');
    L.hpEls=LAYERS.map(function(){
      var h=document.createElement('div');h.className='hp';
      h.innerHTML='<div class="fill"></div><div class="n"></div>';
      L.bars.appendChild(h);return {root:h,fill:h.firstChild,n:h.lastChild};
    });
    lanes.push(L);
  });

  var t=0,winner=null;

  function measure(L){
    L.cw=L.cv.clientWidth||L.cw;L.ch=L.cv.clientHeight||L.ch;
    L.R=Math.max(7,Math.min(L.cw*0.035,L.ch*0.1));
  }

  function reset(){
    t=0;winner=null;
    lanes.forEach(function(L){
      measure(L);
      L.hp=LAYERS.slice();L.layer=0;L.done=false;L.texts=[];L.finishT=0;
      L.el.classList.remove('done','lead');
      L.hpEls.forEach(function(h,i){h.root.classList.remove('dead');h.fill.style.width='100%';h.n.textContent=fmt(LAYERS[i])});
      L.d.init(L);
    });
    document.getElementById('status').textContent='Race in progress';
  }

  function damage(L,d,x,y){
    L.texts.push({x:x,y:y,t:'-'+fmt(d),life:0.9});
    while(d>0&&L.layer<LAYERS.length){
      var take=Math.min(d,L.hp[L.layer]);
      L.hp[L.layer]-=take;d-=take;
      if(L.hp[L.layer]<=0.5){L.hp[L.layer]=0;L.layer++}
    }
    if(L.layer>=LAYERS.length&&!L.done){
      L.done=true;L.finishT=t;L.texts=[];L.balls.forEach(function(q){q.sq=0;q.tr=[]});L.el.classList.add('done');
      L.banner.textContent=t.toFixed(1)+' s';
      if(!winner){winner=L;document.getElementById('status').textContent=L.d.title+' wins in '+t.toFixed(1)+' s'}
    }
  }

  // Energy-conserving bounce: gravity between impacts, perfect reflection on walls and ceiling,
  // and on the floor the same total speed is kept while the angle varies a little.
  function step(dt0){
    lanes.forEach(function(L){
      if(L.done)return;
      var dt=dt0*(L.d.spd||1),G=geo(L),R=G.R,floor=G.h-R,right=G.w-R;
      L.balls.forEach(function(b){
        b.x+=b.vx*dt;
        b.y+=b.vy*dt+0.5*G.g*dt*dt;
        b.vy+=G.g*dt;
        b.rot+=b.vx*dt/R;
        b.sq=Math.max(0,b.sq-dt*7);
        var hit=false,onPlate=false;
        if(b.x<R){b.x=2*R-b.x;b.vx=Math.abs(b.vx);hit='x'}
        else if(b.x>right){b.x=2*right-b.x;b.vx=-Math.abs(b.vx);hit='x'}
        if(b.y<R){b.y=2*R-b.y;b.vy=Math.abs(b.vy);hit='y'}
        else if(b.y>floor){
          b.y=Math.min(floor,2*floor-b.y);
          var vy=Math.abs(b.vy)*(0.88+Math.random()*0.24);
          vy=Math.min(G.vyMax,Math.max(G.vyMin,vy));
          var vx=Math.sqrt(Math.max(0,G.S2-vy*vy));
          b.vy=-vy;b.vx=(b.vx<0?-1:1)*vx;
          hit='y';onPlate=true;
        }
        if(hit){b.sq=1;b.ax=hit}
        if(onPlate)damage(L,L.d.hit(L,b),b.x,b.y);   // only the plate takes damage
      });
      L.texts.forEach(function(x){x.life-=dt;x.y-=G.h*0.15*dt});
      L.texts=L.texts.filter(function(x){return x.life>0});
    });
  }

  function draw(L){
    var cv=L.cv,dpr=Math.min(window.devicePixelRatio||1,2);
    var cw=cv.clientWidth,ch=cv.clientHeight;
    if(!cw||!ch)return;
    L.cw=cw;L.ch=ch;L.R=Math.max(7,Math.min(cw*0.035,ch*0.1));
    if(cv.width!==Math.round(cw*dpr)||cv.height!==Math.round(ch*dpr)){cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr)}
    var g=L.ctx,R=L.R;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,cw,ch);
    if(!L.col){var css=getComputedStyle(L.el);L.col=css.getPropertyValue('--c').trim();L.cd=css.getPropertyValue('--c-d').trim()}
    var col=L.col,cd=L.cd;
    L.balls.forEach(function(b){
      if(!L.done){b.tr.push(b.x,b.y);if(b.tr.length>16)b.tr.splice(0,2)}
      for(var k=0;k<b.tr.length;k+=2){
        var f=k/b.tr.length;
        g.globalAlpha=f*0.22;g.fillStyle=col;g.beginPath();g.arc(b.tr[k],b.tr[k+1],R*(0.45+f*0.5),0,7);g.fill();
      }
      g.globalAlpha=1;
      // ground shadow: smaller and fainter the higher the ball is
      var hgt=Math.min(1,Math.max(0,(ch-R-b.y)/(ch-2*R)));
      g.fillStyle='rgba(0,0,0,'+(0.18-hgt*0.12)+')';
      g.beginPath();g.ellipse(b.x,ch-2,R*(1.05-hgt*0.55),R*0.2,0,0,7);g.fill();
      // ball with squash on impact
      var k2=b.sq*b.sq*0.28,sx=1+k2,sy=1-k2;
      if(b.ax==='x'){var tmp=sx;sx=sy;sy=tmp}
      g.save();g.translate(b.x,b.y);g.scale(sx,sy);
      g.fillStyle=col;g.strokeStyle=cd;g.lineWidth=Math.max(2,R*0.2);
      g.beginPath();g.arc(0,0,R,0,7);g.fill();g.stroke();
      g.save();g.rotate(b.rot);
      g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
      var lb=L.d.label;g.font='700 '+Math.round(R*(lb.length>2?0.62:0.9))+'px "Space Mono",monospace';
      g.fillText(lb,0,R*0.08);
      g.restore();
      g.fillStyle='rgba(255,255,255,.42)';g.beginPath();g.arc(-R*.34,-R*.38,R*.24,0,7);g.fill();
      g.restore();
    });
    g.font='700 '+Math.round(Math.max(11,cw*0.042))+'px "Space Mono",monospace';g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=3;g.strokeStyle='#fcfaf3';
    L.texts.forEach(function(x){
      g.globalAlpha=Math.max(0,Math.min(1,x.life/0.4));g.fillStyle=cd;
      var tx=Math.min(Math.max(x.x,40),cw-40),ty=x.y-R-10;if(ty<30)ty=x.y+R+12;
      g.strokeText(x.t,tx,ty);g.fillText(x.t,tx,ty);
    });
    g.globalAlpha=1;
  }

  function ui(L){
    L.nx.textContent=L.done?'DONE':L.d.next(L);
    L.hpEls.forEach(function(h,i){
      var v=L.hp[i];
      h.root.classList.toggle('dead',v<=0);
      h.fill.style.width=(v/LAYERS[i]*100)+'%';
      h.n.textContent=fmt(Math.ceil(v));
    });
  }

  function leader(){
    var best=null,bs=-1;
    lanes.forEach(function(L){
      var s=L.done?10+(1000-L.finishT)/1000:L.layer+(L.layer<LAYERS.length?1-L.hp[L.layer]/LAYERS[L.layer]:0);
      if(s>bs){bs=s;best=L}
    });
    lanes.forEach(function(L){L.el.classList.toggle('lead',L===best&&bs>0.02)});
  }

  var last=performance.now(),acc=0,FIX=1/240,frameN=0;
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    acc+=dt*speedMul;
    var guard=0;
    while(acc>=FIX&&guard++<200){acc-=FIX;t+=FIX;step(FIX)}
    lanes.forEach(function(L){draw(L);ui(L)});
    if((frameN++%6)===0)leader();
    requestAnimationFrame(frame);
  }

  document.getElementById('restart').onclick=reset;
  document.querySelectorAll('.spd').forEach(function(b){
    b.onclick=function(){
      speedMul=+b.dataset.s;
      document.querySelectorAll('.spd').forEach(function(o){o.setAttribute('aria-pressed',o===b)});
    };
  });

  var started=false;
  function start(){if(started)return;started=true;reset();requestAnimationFrame(function(n){last=n;frame(n)})}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(start);setTimeout(start,1500)}else start();
})();
</script>
