name: prices
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/fetch_prices.py
      # Publica solo prices.json en la rama "prices" (un único commit, sin historial acumulado)
      - run: |
          mkdir out && mv prices.json out/ && cd out
          git init -q -b prices
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add prices.json && git commit -qm "prices $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prices
